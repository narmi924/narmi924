    <style>
      .ribbon { animation:weave 12s cubic-bezier(.45,0,.2,1) infinite; animation-delay:calc(var(--delay) - 3.5s); }
      .face { fill:#221E19; animation:turn 12s ease-in-out infinite; animation-delay:calc(var(--delay) - 3.5s); }
      .edge { fill:#A66D47; opacity:.65; }
      .impression { fill:none; stroke:#8B4513; stroke-width:.55; opacity:.12; }
      @keyframes weave {
        0%,12%,100% { transform:translateY(0) skewY(0); }
        27% { transform:translateY(var(--lift)) skewY(var(--lean)) scaleX(.84); }
        42%,62% { transform:translateY(0) skewY(0); }
        77% { transform:translateY(calc(var(--lift) * -.8)) skewY(calc(var(--lean) * -1)) scaleX(.84); }
        92% { transform:translateY(0) skewY(0); }
      }
      @keyframes turn {
        0%,12%,42%,62%,92%,100% { fill:#221E19; }
        27% { fill:#8B4513; }
        77% { fill:#63422E; }
      }
      @media (prefers-reduced-motion:reduce) { .ribbon,.face { animation:none; } }
